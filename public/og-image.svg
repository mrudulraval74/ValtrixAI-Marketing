<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061B36" />
      <stop offset="0.5" stop-color="#0A2547" />
      <stop offset="1" stop-color="#051329" />
    </linearGradient>
    <radialGradient id="og-glow" cx="600" cy="240" r="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08C5E8" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#0877E8" stop-opacity="0.12" />
      <stop offset="1" stop-color="#061B36" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-v" x1="40" y1="40" x2="140" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08C5E8" />
      <stop offset="0.6" stop-color="#0877E8" />
      <stop offset="1" stop-color="#0652A8" />
    </linearGradient>
    <linearGradient id="og-silver" x1="100" y1="40" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.4" stop-color="#E2E8F0" />
      <stop offset="0.8" stop-color="#94A3B8" />
      <stop offset="1" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="og-cyan" x1="160" y1="160" x2="280" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08C5E8" />
      <stop offset="1" stop-color="#0877E8" />
    </linearGradient>
    <linearGradient id="text-blue-grad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08C5E8" />
      <stop offset="1" stop-color="#0877E8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#0877E8" stroke-opacity="0.2" stroke-width="1" />
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#0877E8" stroke-opacity="0.15" stroke-width="1" />

  <!-- Emblem Centered -->
  <g transform="translate(480, 80) scale(2.8)">
    <path d="M6 10L16 38L24 22L17 10H6Z" fill="url(#og-v)" />
    <path d="M16 38L21 16L24 22L16 38Z" fill="#08C5E8" fill-opacity="0.9" />
    <path d="M21 10H37L42 19L36 30H26L30 22H34L37 18L33 14H24L21 10Z" fill="url(#og-silver)" />
    <path d="M27 25L39 38H45L33 25H27Z" fill="url(#og-cyan)" />
  </g>

  <!-- Wordmark -->
  <text x="600" y="270" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="0.06em">
    <tspan fill="url(#text-blue-grad)">VERI</tspan>
    <tspan fill="#E8EEF5">QON </tspan>
    <tspan fill="#0877E8">ONE</tspan>
  </text>

  <!-- Product Category -->
  <text x="600" y="325" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="0.28em" fill="#08C5E8">
    ENTERPRISE QUALITY ENGINEERING PLATFORM
  </text>

  <!-- Company Tagline -->
  <text x="600" y="390" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="600" fill="#FFFFFF">
    Engineering Trust Through Intelligence.
  </text>

  <!-- Supporting Subtext -->
  <text x="600" y="440" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    A unified platform connecting requirements, automation, ETL testing, performance &amp; security.
  </text>

  <!-- Parent Company Label at Bottom -->
  <text x="600" y="565" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.2em" fill="#C7D0DA">
    VERIQON TECHNOLOGIES
  </text>
</svg>
